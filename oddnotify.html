<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OddNotify测试页</title>
    <link rel="icon" href="static/images/favicon.ico">
    <link rel="stylesheet" href="static/tools.css">
</head>
<body class="tools-layout">
<div id="sidebar-container"></div>
<div class="tools-main">




    <div class="container">
        <div class="page-header">
            <h1>通知推送</h1>
            <p class="subtitle">通过 OddNotify 发送消息通知到多种渠道</p>
        </div>

        <div class="panel">
            <div style="text-align:center;margin-bottom:20px;">
                <a href="{% url 'tools/oddnotify' %}"><img src="static/images/odd_notify.png" alt="OddNotifier" style="max-width:240px;height:auto;"></a>
            </div>
            <div style="text-align:center;margin-bottom:20px;">
                <a href="https://oddmeta.net/docs/oddnotifier" style="color:var(--primary);font-size:13px;">如何使用 OddNotify？</a>
            </div>

            {% if message %}
            <div class="message-box {% if '成功' in message %}success{% else %}error{% endif %} show">
                {{ message }}
            </div>
            {% endif %}

            <form id="myForm" method="post" action="{% url 'tools/oddnotify' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label>类型</label>
                    <select id="odd_notify_type" name="odd_notify_type" onchange="odd_notify_type_onchange();">
                        <option>----请选择类型----</option>
                        {% for key, value in odd_notify_type.items %}
                            <option value="{{ value | safe }}">{{ key }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>配置</label>
                    <textarea id="config" name="config" placeholder="输入你的OddNotify配置"></textarea>
                </div>
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="title" name="title" required placeholder="Your notifiy title">
                </div>
                <div class="form-group">
                    <label>内容</label>
                    <textarea id="content" name="content" required placeholder="Input your notify content"></textarea>
                </div>
                <div class="buttons">
                    <button type="submit" class="btn btn-primary">通知</button>
                    <button type="reset" class="btn btn-secondary">重置</button>
                </div>
            </form>
        </div>

        <div class="info-section">
            <h3>使用说明</h3>
            <p>选择通知类型，填写 OddNotify 配置信息，输入标题和内容后点击「通知」按钮即可发送消息。</p>
            <p>如需了解如何获取 OddNotify 配置，请查看 <a href="https://oddmeta.net/docs/oddnotifier" style="color:var(--primary);">使用文档</a>。</p>
        </div>
    </div>

    <script>
        function odd_notify_type_onchange() {
            var odd_notify_type = document.getElementById("odd_notify_type").value;
            var config = document.getElementById("config");
            console.log("odd_notify_type: " + odd_notify_type);
            config.innerHTML  = odd_notify_type;
        }

        function notify() {

        }
    </script>

</div>
<script src="static/sidebar-loader.js"></script>
</body>
</html>
