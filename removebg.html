<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片背景移除</title>
    <link rel="icon" href="static/images/favicon.ico">
    <link rel="stylesheet" href="static/tools.css">
    <style>
        .upload-preview {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .preview-container {
            flex: 1;
            min-width: 300px;
        }
        
        .preview-container h3 {
            margin-top: 0;
            text-align: center;
        }
        
        .preview-img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: 
                linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%),
                linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        
        .controls {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .slider-container input[type="range"] {
            flex: 1;
        }
        
        .slider-value {
            width: 50px;
            text-align: center;
            font-family: monospace;
        }
        
        .processing-indicator {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .btn-group .btn {
            flex: 1;
            min-width: 120px;
        }
    </style>
</head>
<body class="tools-layout">
<div id="sidebar-container"></div>
<div class="tools-main">

    <div class="container">
        <div class="page-header">
            <h1>图片背景移除</h1>
            <p class="subtitle">上传图片并移除背景，支持智能识别前景主体</p>
        </div>

        <div class="upload-zone" id="uploadZone">
            <div class="icon">&#128247;</div>
            <p class="main-text">点击选择，或将图片文件拖放到此处</p>
            <p class="sub-text">图片格式：png | jpg | jpeg | webp | bmp (最大 10MB)</p>
            <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg,image/webp,image/bmp">
        </div>

        <div class="processing-indicator" id="processingIndicator">
            <p>正在处理图片，请稍候...</p>
            <div class="spinner"></div>
        </div>

        <div class="upload-preview" id="previewSection" style="display: none;">
            <div class="preview-container">
                <h3>原始图片</h3>
                <img id="originalImg" class="preview-img" alt="原始图片">
            </div>
            <div class="preview-container">
                <h3>透明背景</h3>
                <img id="resultImg" class="preview-img" alt="处理结果">
            </div>
        </div>

        <div class="controls" id="controls" style="display: none;">
            <div class="control-group">
                <label for="algorithmSelect">算法选择</label>
                <select id="algorithmSelect">
                    <option value="chromakey">绿幕抠图 (适合纯色背景)</option>
                    <option value="edge">边缘检测 (适合简单背景)</option>
                    <option value="simple">简单阈值 (适合对比明显)</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="toleranceSlider">容差调整 <span id="toleranceValue">50</span></label>
                <div class="slider-container">
                    <input type="range" id="toleranceSlider" min="1" max="100" value="50">
                    <span class="slider-value" id="toleranceDisplay">50</span>
                </div>
            </div>
            
            <div class="control-group">
                <label for="smoothnessSlider">平滑度 <span id="smoothnessValue">30</span></label>
                <div class="slider-container">
                    <input type="range" id="smoothnessSlider" min="1" max="100" value="30">
                    <span class="slider-value" id="smoothnessDisplay">30</span>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="processImage()">处理图片</button>
                <button class="btn btn-secondary" onclick="downloadResult()">下载结果</button>
                <button class="btn btn-outline" onclick="resetProcess()">重新选择</button>
            </div>
        </div>

        <div class="info-section">
            <h2>使用说明</h2>
            <p>本工具在浏览器端运行，图片不会上传到服务器，保护您的隐私安全。</p>
            <ul>
                <li>支持 JPG、PNG、WEBP、BMP 等常见图片格式</li>
                <li>推荐使用前景主体与背景颜色差异较大的图片</li>
                <li>绿幕抠图适用于绿色或蓝色背景的专业图片</li>
                <li>边缘检测适合简单单色背景的图片</li>
                <li>处理后的图片将保留透明背景，下载为 PNG 格式</li>
            </ul>
        </div>
    </div>

    <script>
        let originalCanvas = null;
        let resultCanvas = null;
        let currentFileName = '';
        
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const processingIndicator = document.getElementById('processingIndicator');
        const previewSection = document.getElementById('previewSection');
        const originalImg = document.getElementById('originalImg');
        const resultImg = document.getElementById('resultImg');
        const controls = document.getElementById('controls');

        // 事件监听
        uploadZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });
        
        uploadZone.addEventListener('dragover', e => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        
        uploadZone.addEventListener('dragleave', e => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
        });
        
        uploadZone.addEventListener('drop', e => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        // 滑块事件监听
        document.getElementById('toleranceSlider').addEventListener('input', function() {
            document.getElementById('toleranceDisplay').textContent = this.value;
            document.getElementById('toleranceValue').textContent = this.value;
        });
        
        document.getElementById('smoothnessSlider').addEventListener('input', function() {
            document.getElementById('smoothnessDisplay').textContent = this.value;
            document.getElementById('smoothnessValue').textContent = this.value;
        });

        function handleFile(file) {
            // 检查文件大小 (最大10MB)
            if (file.size > 10 * 1024 * 1024) {
                alert('文件大小不能超过10MB');
                return;
            }
            
            currentFileName = file.name;
            const reader = new FileReader();
            
            reader.onload = function(e) {
                originalImg.src = e.target.result;
                originalImg.onload = function() {
                    // 显示预览区域和控件
                    uploadZone.style.display = 'none';
                    previewSection.style.display = 'flex';
                    controls.style.display = 'block';
                    
                    // 初始化画布
                    initCanvas();
                };
            };
            
            reader.onerror = function() {
                alert('文件读取失败');
            };
            
            reader.readAsDataURL(file);
        }

        function initCanvas() {
            // 创建原始画布
            originalCanvas = document.createElement('canvas');
            originalCanvas.width = originalImg.naturalWidth;
            originalCanvas.height = originalImg.naturalHeight;
            
            const ctx = originalCanvas.getContext('2d');
            ctx.drawImage(originalImg, 0, 0);
        }

        function processImage() {
            if (!originalCanvas) {
                alert('请先上传图片');
                return;
            }
            
            showProcessing(true);
            
            // 使用 setTimeout 来避免阻塞UI
            setTimeout(() => {
                try {
                    const algorithm = document.getElementById('algorithmSelect').value;
                    const tolerance = parseInt(document.getElementById('toleranceSlider').value);
                    const smoothness = parseInt(document.getElementById('smoothnessSlider').value);
                    
                    resultCanvas = removeBackground(algorithm, tolerance, smoothness);
                    resultImg.src = resultCanvas.toDataURL('image/png');
                    
                    showProcessing(false);
                } catch (error) {
                    console.error('处理图片时出错:', error);
                    alert('图片处理失败: ' + error.message);
                    showProcessing(false);
                }
            }, 100);
        }

        function removeBackground(algorithm, tolerance, smoothness) {
            const canvas = document.createElement('canvas');
            canvas.width = originalCanvas.width;
            canvas.height = originalCanvas.height;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(originalCanvas, 0, 0);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            switch(algorithm) {
                case 'chromakey':
                    chromaKeyRemoval(data, tolerance, smoothness);
                    break;
                case 'edge':
                    edgeBasedRemoval(data, tolerance, smoothness);
                    break;
                case 'simple':
                    simpleThresholdRemoval(data, tolerance);
                    break;
                default:
                    simpleThresholdRemoval(data, tolerance);
            }
            
            ctx.putImageData(imageData, 0, 0);
            return canvas;
        }

        // 改进的绿幕抠图算法
        function chromaKeyRemoval(data, tolerance, smoothness) {
            // 获取图片四个角和中心的颜色样本，找出最常见的颜色作为背景色
            const width = originalCanvas.width;
            const height = originalCanvas.height;
            
            // 获取多个位置的颜色样本
            const samples = [];
            samples.push(getPixelColor(data, 0, 0, width));
            samples.push(getPixelColor(data, width-1, 0, width));
            samples.push(getPixelColor(data, 0, height-1, width));
            samples.push(getPixelColor(data, width-1, height-1, width));
            samples.push(getPixelColor(data, Math.floor(width/2), Math.floor(height/2), width));
            
            // 计算平均背景色
            let avgR = 0, avgG = 0, avgB = 0;
            for (const sample of samples) {
                avgR += sample.r;
                avgG += sample.g;
                avgB += sample.b;
            }
            avgR = Math.round(avgR / samples.length);
            avgG = Math.round(avgG / samples.length);
            avgB = Math.round(avgB / samples.length);
            
            // 计算容差范围
            const toleranceFactor = tolerance / 50; // 调整因子
            
            for (let i = 0; i < data.length; i += 4) {
                const pixelR = data[i];
                const pixelG = data[i + 1];
                const pixelB = data[i + 2];
                
                // 计算颜色距离
                const dr = Math.abs(pixelR - avgR);
                const dg = Math.abs(pixelG - avgG);
                const db = Math.abs(pixelB - avgB);
                const distance = Math.sqrt(dr*dr + dg*dg + db*db);
                
                // 使用更平滑的过渡
                const threshold = 255 * toleranceFactor;
                let alpha = 255;
                
                if (distance < threshold) {
                    // 平滑过渡，而不是硬边缘
                    const ratio = distance / threshold;
                    alpha = Math.max(0, Math.min(255, 255 * ratio * ratio)); // 二次函数实现更平滑的过渡
                }
                
                data[i + 3] = alpha; // 设置alpha通道
            }
        }

        // 改进的边缘检测算法
        function edgeBasedRemoval(data, tolerance, smoothness) {
            const width = originalCanvas.width;
            const height = originalCanvas.height;
            
            // 创建临时数组存储边缘强度
            const edgeStrength = new Array(width * height).fill(0);
            
            // 使用Sobel算子计算梯度
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = y * width + x;
                    
                    // Sobel X方向
                    const gx = 
                        -1 * getPixelBrightness(data, (y-1) * width + (x-1)) +
                        -2 * getPixelBrightness(data, y * width + (x-1)) +
                        -1 * getPixelBrightness(data, (y+1) * width + (x-1)) +
                         1 * getPixelBrightness(data, (y-1) * width + (x+1)) +
                         2 * getPixelBrightness(data, y * width + (x+1)) +
                         1 * getPixelBrightness(data, (y+1) * width + (x+1));

                    // Sobel Y方向
                    const gy = 
                        -1 * getPixelBrightness(data, (y-1) * width + (x-1)) +
                         -2 * getPixelBrightness(data, (y-1) * width + x) +
                         -1 * getPixelBrightness(data, (y-1) * width + (x+1)) +
                          1 * getPixelBrightness(data, (y+1) * width + (x-1)) +
                          2 * getPixelBrightness(data, (y+1) * width + x) +
                          1 * getPixelBrightness(data, (y+1) * width + (x+1));

                    // 计算梯度幅值
                    const magnitude = Math.sqrt(gx * gx + gy * gy);
                    edgeStrength[idx] = Math.min(255, magnitude);
                }
            }
            
            // 应用阈值和处理
            const threshold = tolerance * 2; // 调整阈值
            
            for (let i = 0; i < data.length; i += 4) {
                const pixelIndex = i / 4;
                const strength = edgeStrength[pixelIndex];
                
                // 根据边缘强度设置透明度
                if (strength > threshold) {
                    // 是边缘，保持不透明
                    data[i + 3] = 255;
                } else {
                    // 不是边缘，逐渐变为透明
                    data[i + 3] = Math.max(0, Math.min(255, strength * (255 / 255)));
                }
            }
            
            // 应用平滑度设置
            applySmoothness(data, width, height, smoothness);
        }

        // 获取像素颜色
        function getPixelColor(data, x, y, width) {
            const idx = (y * width + x) * 4;
            return {
                r: data[idx],
                g: data[idx + 1],
                b: data[idx + 2]
            };
        }

        // 获取像素亮度 (灰度值)
        function getPixelBrightness(data, idx) {
            const i = idx * 4;
            return 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        }

        // 应用平滑度
        function applySmoothness(data, width, height, smoothness) {
            if (smoothness < 5) return; // 如果平滑度很小，则跳过
            
            const kernelSize = Math.max(1, Math.floor(smoothness / 20));
            const halfKernel = Math.floor(kernelSize / 2);
            
            // 创建临时数据副本
            const tempData = new Uint8ClampedArray(data);
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let sumAlpha = 0;
                    let count = 0;
                    
                    for (let ky = -halfKernel; ky <= halfKernel; ky++) {
                        for (let kx = -halfKernel; kx <= halfKernel; kx++) {
                            const ny = Math.max(0, Math.min(height - 1, y + ky));
                            const nx = Math.max(0, Math.min(width - 1, x + kx));
                            
                            const nIdx = (ny * width + nx) * 4 + 3;
                            sumAlpha += tempData[nIdx];
                            count++;
                        }
                    }
                    
                    const idx = (y * width + x) * 4 + 3;
                    data[idx] = Math.round(sumAlpha / count);
                }
            }
        }

        // 改进的简单阈值算法
        function simpleThresholdRemoval(data, tolerance) {
            // 计算图片的统计信息
            let totalR = 0, totalG = 0, totalB = 0;
            let count = 0;
            
            // 先遍历一次收集统计信息
            for (let i = 0; i < data.length; i += 4) {
                totalR += data[i];
                totalG += data[i + 1];
                totalB += data[i + 2];
                count++;
            }
            
            const avgR = Math.round(totalR / count);
            const avgG = Math.round(totalG / count);
            const avgB = Math.round(totalB / count);
            
            // 再次遍历，计算每个像素与平均颜色的距离
            for (let i = 0; i < data.length; i += 4) {
                const pixelR = data[i];
                const pixelG = data[i + 1];
                const pixelB = data[i + 2];
                
                // 计算与平均颜色的距离
                const dr = Math.abs(pixelR - avgR);
                const dg = Math.abs(pixelG - avgG);
                const db = Math.abs(pixelB - avgB);
                const distance = Math.sqrt(dr*dr + dg*dg + db*db);
                
                // 使用更合理的阈值
                const threshold = 100 + (tolerance * 1.55); // tolerance: 0-100 -> threshold: 100-255
                
                if (distance > threshold) {
                    // 与平均颜色差异大，认为是前景，保持不透明
                    data[i + 3] = 255;
                } else {
                    // 与平均颜色相似，认为是背景，设为透明
                    data[i + 3] = 0;
                }
            }
        }

        function downloadResult() {
            if (!resultCanvas) {
                alert('请先处理图片');
                return;
            }
            
            const link = document.createElement('a');
            link.download = currentFileName.replace(/\.[^/.]+$/, '') + '_transparent.png';
            link.href = resultCanvas.toDataURL('image/png');
            link.click();
        }

        function resetProcess() {
            fileInput.value = '';
            uploadZone.style.display = 'flex';
            previewSection.style.display = 'none';
            controls.style.display = 'none';
            originalImg.src = '';
            resultImg.src = '';
            originalCanvas = null;
            resultCanvas = null;
            currentFileName = '';
        }

        function showProcessing(show) {
            processingIndicator.style.display = show ? 'block' : 'none';
        }
    </script>
</div>
<script src="static/sidebar-loader.js"></script>
</body>
</html>
