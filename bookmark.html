<script>
    function removeBookmark(index) {

    }

    function getBookmarks() {

    }

    function checkInput() {
      let book_url = $("#book_url").val();
      if (book_url == "") {
        showtip("请输入书签的URL！");
        return false;
      }
      return true;
    }

    $('#btn_bookmark').click(function(e) {
      if (checkInput() == false)
        return false;

      let article_url = $("#article_url").val();
      let myurl = '/bookmark';

      var data = new FormData();
      data.append("article_url", article_url);
      
      console.log("POST url=" + myurl + ",data:" + data);

      e.preventDefault();

      // modalDlg(true);

      var csrftoken = getCookie('csrftoken');
      $.ajaxSetup({
          beforeSend: function(xhr, settings) {
              if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type) && !this.crossDomain) {
                  xhr.setRequestHeader("X-CSRFToken", csrftoken);
              }
          }
      });

      $.ajax({type: 'POST', url: myurl, data: data, cache: false, processData: false, contentType: false, async: true,
        success: function (r) {
          // modalDlg(false);
          console.log("response:"+ r);
          if (r['code'] == 200) {
            showtip("新增模型成功！");
            window.location.href = "/bookmark.html";
          } else {
            showtip("新增模型失败！" + r['response']);
          }
        }, error: function (r) {
          // console.log(r.responseText); 
          showtip("新增模型失败1！" + r.responseText);
          // modalDlg(false)
        },
        failure: function (r) {
          // console.log(r.responseText);
          showtip("新增模型失败2！" + r.responseText);
        }
      })
    });

    function showtip(msg) {
      $("#tip").html(msg);
      $("#tip").show();
      setTimeout(function() {
        $("#tip").hide();
      }, 3000);
    }

</script>
